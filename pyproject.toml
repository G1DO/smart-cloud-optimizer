[tool.pytest.ini_options]
# The public artifact ships no tests; retain these settings for tests added here.
testpaths = ["tests"]
addopts = "-v --tb=short --basetemp=.pytest_tmp"

[tool.coverage.run]
source = ["storage", "ml_engine", "optimizer", "config"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0
