# secrets — history-aware secrets scan for `main`.
# Local parity: `poe check:secrets` (gitleaks).
# Triggers: PRs and pushes targeting `main` only, plus nightly and manual.
# No `|| true`, no `continue-on-error`. Does not touch release/ccpe-v1.0.
name: secrets

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for history-aware scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -eu
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks history scan
        run: |
          set -eu
          gitleaks detect --source . --config .gitleaks.toml --verbose

      - name: Gitleaks working-tree scan
        run: |
          set -eu
          gitleaks detect --source . --config .gitleaks.toml --no-git --verbose
