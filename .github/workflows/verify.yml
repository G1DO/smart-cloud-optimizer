# verify — sole CI gate for `main` (Starter §CI Gate job).
# Local parity: `poe verify` runs test → migrate → build →
# check:hygiene → diagrams (see pyproject.toml [tool.poe.tasks.verify]).
# CI mirrors the same task verbs; `gate` is the single aggregating check
# required in branch protection. No `|| true`, no `continue-on-error`.
# Triggers: PRs and pushes targeting `main` only, plus nightly on `main`
# and manual dispatch. Does not touch release/ccpe-v1.0.
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly on main (02:17 UTC). Active once this workflow exists on the
    # default branch; until then PR/push triggers still cover `main`.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Full local gate: test, migrate, build, hygiene, diagrams.
  # Hygiene covers `git diff --check`, compileall, frontend lint, stub-marker
  # grep. Diagrams validates versioned `.mmd` sources via mmdc and rejects
  # pasted ```mermaid blocks (see poe tasks check:hygiene, diagrams).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history for diff-check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python (match Dockerfile 3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node (frontend lint + mmdc)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps + task runner
        run: |
          set -eu
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install poethepoet

      - name: Install frontend deps (required by check:hygiene)
        run: |
          set -eu
          npm ci --prefix frontend

      - name: Install mermaid-cli (diagrams validation)
        run: |
          set -eu
          npm install -g @mermaid-js/mermaid-cli
          mmdc --version

      - name: Run verify (test → migrate → build → check:hygiene → diagrams)
        run: |
          set -eu
          poe verify

  # Full-history secrets scan (gitleaks). Uses .gitleaks.toml allowlist for
  # synthetic SYNTHETIC-001 placeholders only; real leaks fail closed.
  secrets-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -eu
          GITLEAKS_VERSION="8.30.1"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks full-history scan
        run: |
          set -eu
          gitleaks detect --source . --config .gitleaks.toml --verbose

  # Single aggregating gate — the SOLE required status check in branch
  # protection for `main`. Fails unless every required job succeeded.
  gate:
    runs-on: ubuntu-latest
    needs: [verify, secrets-history]
    if: always()
    steps:
      - name: Aggregate required checks
        run: |
          set -eu
          echo "verify=${{ needs.verify.result }} secrets-history=${{ needs.secrets-history.result }}"
          test "${{ needs.verify.result }}" = "success"
          test "${{ needs.secrets-history.result }}" = "success"
          echo "gate ok"
